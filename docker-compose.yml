# Pila de producción de Spotter: Caddy (HTTPS automático), la web, la API y MongoDB.
#
#   cp .env.production.example .env.production      (y rellenar el dominio y los secretos)
#   docker compose --env-file .env.production up -d --build
#
# Solo Caddy publica puertos (80 y 443). La web, la API y MongoDB se hablan por la red interna de Docker.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?hace falta DOMAIN en el .env.production}
      API_DOMAIN: ${API_DOMAIN:?hace falta API_DOMAIN en el .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?hace falta ACME_EMAIL en el .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Aquí se guardan los certificados: si se pierden, se piden otra vez
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  # La web (React + nginx). Se construye desde su repositorio, con la dirección de la API metida en el build
  web:
    build:
      context: https://github.com/SpotterP/webapp-spotter.git#dev
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped

  api:
    build: .
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/spotter
      SERVER_PORT: 1337
      # Solo la web puede llamar a la API desde un navegador
      CORS_ORIGIN: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?hace falta JWT_SECRET en el .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?hace falta JWT_REFRESH_SECRET en el .env.production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1337/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
