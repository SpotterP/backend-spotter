# Solo para la prueba del CI (.github/workflows/https-stack.yml): se usa junto al docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.acme-test.yml up -d --build
#
# Añade Pebble, el servidor de pruebas de ACME (el protocolo de Let's Encrypt), y un servidor DNS de pruebas
# que resuelve cualquier nombre a Caddy. Así Caddy pide el certificado como lo haría con Let's Encrypt
# (reto HTTP-01), sin necesitar un dominio ni un servidor de verdad.
# No se usa en producción.

networks:
  default:
    ipam:
      config:
        # Docker reparte las IPs automáticas solo de la mitad alta (.128 a .255), así las IPs fijas de abajo
        # (Pebble, el DNS de pruebas y Caddy) no las puede coger antes ningún otro contenedor
        - subnet: 10.30.50.0/24
          ip_range: 10.30.50.128/25

services:
  caddy:
    volumes:
      # El Caddyfile de producción con el servidor de pruebas (lo genera el workflow) y su certificado raíz
      - ./deploy/Caddyfile.pebble:/etc/caddy/Caddyfile:ro
      - ./deploy/pebble.minica.pem:/etc/caddy/pebble.minica.pem:ro
    networks:
      default:
        ipv4_address: 10.30.50.10
    depends_on:
      - pebble

  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: ["-config", "/etc/pebble/pebble-config.json", "-strict=false", "-dnsserver", "10.30.50.3:8053"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    volumes:
      - ./deploy/pebble-config.json:/etc/pebble/pebble-config.json:ro
    networks:
      default:
        ipv4_address: 10.30.50.2
    depends_on:
      - challtestsrv

  # DNS de pruebas: contesta a Pebble que cualquier nombre está en la IP de Caddy
  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    command: ["-defaultIPv6", "", "-defaultIPv4", "10.30.50.10"]
    networks:
      default:
        ipv4_address: 10.30.50.3
