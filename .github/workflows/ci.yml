name: CI

# En main, cada commit deja una imagen nueva, etiquetada `latest`: es lo que se despliega.
# En un pull request contra main solo se comprueba que compila y pasan los tests: no se publica nada.
# Cada imagen lleva ademas su tag sha-<corto>, que es lo que permite volver a una version concreta.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Los pushes se encolan en vez de pisarse: cada commit publica su tag sha-<corto>
# y `latest` queda siempre en el último que termine.
# GitHub puede descartar un run aún encolado si llegan varios pushes de golpe;
# lo que no se pierde nunca es que `latest` acabe en el commit más nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Los tests levantan la API y un Mongo en memoria: si uno falla, el job falla.
      - run: npm test

  image:
    name: Build and push image
    # La imagen solo se publica cuando algo entra en main, nunca desde un pull request.
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tags
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Sin esta etiqueta, GHCR no enlaza el paquete con el repositorio y la
          # imagen no aparece en su página de paquetes.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha_short }}
